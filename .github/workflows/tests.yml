name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Порт P11: ни одна команда не должна требовать TTY, поэтому stdin закрыт.
      - name: Tests
        run: python -m pytest

      # 100% покрытия — гейт проекта, а не отчёт: падение ниже останавливает сборку.
      # Отчёт выводится с -m (номера недостающих строк) и при падении дублируется
      # аннотацией: лог job'а доступен только с отдельного хоста, а аннотацию видно
      # через обычный API. Без этого падение гейта на другой версии Python остаётся
      # непроверяемым извне.
      - name: Coverage (100% gate)
        run: |
          python -m coverage run --branch --source=src/todoc -m pytest -q
          status=0
          python -m coverage report -m --fail-under=100 > /tmp/cov.txt || status=$?
          cat /tmp/cov.txt
          if [ "$status" -ne 0 ]; then
            grep -v ' 100%$' /tmp/cov.txt | sed 's/^/::error title=coverage::/' || true
          fi
          exit "$status"

      - name: Linkcheck
        run: python tools/linkcheck.py

      - name: Docs are valid documents
        run: python -m todoc --root demo --output json validate --all
