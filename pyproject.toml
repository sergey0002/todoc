[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "todoc"
version = "0.1.0"
description = "Portable typed knowledge substrate: source-native validator + bounded search/read CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "jsonschema>=4.18",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "coverage>=7.4",
]

[project.scripts]
todoc = "todoc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["src/todoc"]

[tool.coverage.report]
show_missing = true
skip_covered = false
